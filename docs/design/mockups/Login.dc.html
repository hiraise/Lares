<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подключение к серверу</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
body{margin:0}
a{color:#1B45C4}a:hover{color:#2F5BEA}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 250,'GRAD' 0,'opsz' 24}
button,input{font:inherit}
input:focus{outline:2px solid #2F5BEA;outline-offset:-2px}
</style>
</helmet>
<div style="--bg:#F3F4F7;--card:#FFFFFF;--t1:#15171C;--t2:#5B606B;--sep:#ECEEF3;--ol:#D5D9E2;--p:#2F5BEA;--psoft:#E4EBFF;--pfg:#1B45C4;width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--t1);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;padding:72px 24px 32px;gap:32px">

  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
    <svg role="img" aria-label="Значок FamilyHub" width="88" height="88" viewBox="0 0 88 88">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F5BEA"></stop><stop offset="1" stop-color="#0A7BAD"></stop></linearGradient></defs>
      <rect width="88" height="88" rx="26" fill="url(#lg)"></rect>
      <path d="M24 42 L44 25 L64 42 V62 a4 4 0 0 1 -4 4 H28 a4 4 0 0 1 -4 -4 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"></path>
      <circle cx="38" cy="50" r="4" fill="none" stroke="#FFFFFF" stroke-width="3"></circle>
      <circle cx="51" cy="52" r="3" fill="none" stroke="#FFFFFF" stroke-width="3"></circle>
      <path d="M31 66 a7 7 0 0 1 14 0 M45.5 66 a5.5 5.5 0 0 1 11 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <h1 style="margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-0.02em">FamilyHub</h1>
    <p style="margin:0;font-size:15px;line-height:1.45;color:var(--t2);max-width:290px">Задачи, покупки, календарь и бюджет семьи на вашем собственном сервере</p>
  </div>

  <form style="display:flex;flex-direction:column;gap:16px;background:var(--card);border-radius:24px;padding:20px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="server" style="font-size:14px;font-weight:700">Адрес сервера</label>
      <input id="server" type="url" value="https://hub.petrovy.ru" style="height:52px;border-radius:14px;border:1px solid var(--ol);background:var(--bg);padding:0 16px;font-size:16px;color:var(--t1);box-sizing:border-box">
      <span style="font-size:13px;color:var(--t2)">Его даёт тот, кто настроил сервер для вашей семьи</span>
    </div>
    <button type="button" style="height:52px;border-radius:26px;border:0;background:var(--p);color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer">Продолжить</button>
    <div style="display:flex;align-items:center;gap:12px;color:var(--t2);font-size:13px"><span style="flex:1;height:1px;background:var(--sep)"></span>или<span style="flex:1;height:1px;background:var(--sep)"></span></div>
    <button type="button" style="height:52px;border-radius:26px;border:0;background:var(--psoft);color:var(--pfg);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer"><span class="ms" aria-hidden="true">qr_code_scanner</span>Сканировать QR-приглашение</button>
  </form>

  <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:16px">
    <p style="margin:0;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--t2);max-width:310px"><span class="ms" aria-hidden="true" style="font-size:20px;flex:none">lock</span>Данные семьи хранятся только на вашем сервере. Без рекламы, слежки и платных подписок.</p>
    <button type="button" style="height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--ol);background:transparent;color:var(--t1);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer"><span class="ms" aria-hidden="true" style="font-size:20px">language</span>Русский</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
