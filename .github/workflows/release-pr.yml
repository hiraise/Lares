name: Release PR

# Only release/X.Y.Z branches with a bumped version, no tag yet and CHANGELOG notes may be merged into main (ADR-0020).
# A separate workflow, so that no skipped run of this job (which GitHub counts as passed) exists for other events.
# Job release-pr is required by the main ruleset (.github/rulesets/main.json).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the release branch, version and notes
        run: tools/release/check.sh "$GITHUB_HEAD_REF"
