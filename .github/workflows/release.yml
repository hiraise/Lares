name: Release

# Every push to main is a release (ADR-0020): main is protected and changes only through a merged release/X.Y.Z pull
# request, already checked by CI (job release-pr). This workflow builds and tests, pushes the multi-arch server image to
# GHCR, then creates the tag vX.Y.Z and the GitHub Release with the signed APK, its SHA-256 checksum file and notes from
# CHANGELOG.md. The tag is
# created last, so a failed run can simply be re-run. Process: docs/process/release.md.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from gradle.properties
        id: meta
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released; main must change only through a release/X.Y.Z pull request"
            exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/lares-server" >> "$GITHUB_OUTPUT"

      - name: Check, test and build the server distribution
        run: ./gradlew check :server:installDist --stacktrace

      # The release APK must be signed with the permanent Lares key (ADR-0019); without it the release fails.
      - name: Build and verify the signed APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release keystore secrets are not configured (see docs/process/release.md)"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew :client:android:assembleRelease --stacktrace
          apk="$RUNNER_TEMP/lares-$VERSION.apk"
          cp client/android/build/outputs/apk/release/android-release.apk "$apk"
          tools/release/verify-apk.sh "$apk"
          (cd "$RUNNER_TEMP" && sha256sum "lares-$VERSION.apk" > "lares-$VERSION.apk.sha256")

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: tools/release/notes.sh "$VERSION" "$RUNNER_TEMP/lares-$VERSION.apk" > "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Tag and GitHub Release with the APK and its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/lares-$VERSION.apk" "$RUNNER_TEMP/lares-$VERSION.apk.sha256" --target "$GITHUB_SHA" \
            --title "Lares v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
