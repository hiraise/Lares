name: Release

# On a version tag (v0.1.0): build and test, push the multi-arch server image to GHCR, attach the APK to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$gradle_version in gradle.properties"
            exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/familyhub-server" >> "$GITHUB_OUTPUT"

      - name: Check, test and build the server distribution
        run: ./gradlew check :server:installDist --stacktrace

      - name: Release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore configured; attaching the debug-signed APK"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          VERSION: ${{ steps.meta.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then
            ./gradlew :client:android:assembleRelease --stacktrace
            cp client/android/build/outputs/apk/release/android-release.apk "$RUNNER_TEMP/familyhub-$VERSION.apk"
          else
            ./gradlew :client:android:assembleDebug --stacktrace
            cp client/android/build/outputs/apk/debug/android-debug.apk "$RUNNER_TEMP/familyhub-$VERSION-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/familyhub-*.apk --title "FamilyHub $GITHUB_REF_NAME" --generate-notes
