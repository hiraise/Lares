name: CI

# Checks every release branch push and every pull request (ADR-0020). main itself changes only through a release pull
# request; the merge starts release.yml. The jobs build, deploy-smoke and release-pr are required by the main ruleset
# (.github/rulesets/main.json), so renaming a job means updating the ruleset too.
on:
  push:
    branches: ["release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build debug APK
        run: ./gradlew check :client:android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lares-debug-apk
          path: client/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Only release/X.Y.Z branches with a bumped version and CHANGELOG notes may be merged into main.
  release-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the release branch, version and notes
        run: tools/release/check.sh "$GITHUB_HEAD_REF"

  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the server distribution
        run: ./gradlew :server:installDist --stacktrace

      - name: Smoke test the Docker Compose stack (HTTPS, setup, backup, restore, ntfy)
        run: deploy/scripts/smoke.sh
