name: CI

# Checks every release branch push and every pull request (ADR-0020). main itself changes only through a release pull
# request; the merge starts release.yml. The jobs build and deploy-smoke (and release-pr in release-pr.yml) are required
# by the main ruleset (.github/rulesets/main.json), so renaming a job means updating the ruleset too.
on:
  push:
    branches: ["release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build debug APK
        run: ./gradlew check :client:android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lares-debug-apk
          path: client/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the server distribution
        run: ./gradlew :server:installDist --stacktrace

      - name: Smoke test the Docker Compose stack (HTTPS, setup, backup, restore, ntfy)
        run: deploy/scripts/smoke.sh
