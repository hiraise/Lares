# Local development database. Start: docker compose -f deploy/dev/docker-compose.yml up -d
# If host port 5432 is taken, set LARES_DEV_DB_PORT (and LARES_DB_URL for the server) to another port.
# Not for production: see deploy/ (M0-10).
name: lares-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lares
      POSTGRES_PASSWORD: lares
      POSTGRES_DB: lares
    ports:
      - "127.0.0.1:${LARES_DEV_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - lares-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lares -d lares"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  lares-dev-db:
