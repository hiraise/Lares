# Lares production stack (ADR-0005). Run from this directory with a filled-in `.env` (copy `.env.example`):
#   docker compose up -d                     # server, database, HTTPS proxy
#   docker compose --profile push up -d      # plus ntfy for instant notifications (see .env.example)
# Installation guide: docs/user/en/install-server.md. Only Caddy publishes ports.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lares
      POSTGRES_DB: lares
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lares", "-d", "lares"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  server:
    image: ${LARES_IMAGE:-ghcr.io/hiraise/lares-server}:${LARES_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LARES_DB_URL: jdbc:postgresql://postgres:5432/lares
      LARES_DB_USER: lares
      LARES_DB_PASSWORD: ${LARES_DB_PASSWORD:?set LARES_DB_PASSWORD in .env (same value as POSTGRES_PASSWORD)}
      LARES_PUBLIC_URL: ${LARES_PUBLIC_URL:-https://${LARES_DOMAIN:?set LARES_DOMAIN in .env}}
      LARES_SETUP_CODE: ${LARES_SETUP_CODE:-}
      LARES_LOG_FORMAT: ${LARES_LOG_FORMAT:-json}
      LARES_PUSH_ALLOWED_HOSTS: ${LARES_PUSH_ALLOWED_HOSTS:-}
      LARES_MAP_STYLE_URL: ${LARES_MAP_STYLE_URL:-https://tiles.versatiles.org/assets/styles/colorful/style.json}
      LARES_MAP_STYLE_DARK_URL: ${LARES_MAP_STYLE_DARK_URL:-https://tiles.versatiles.org/assets/styles/colorful-dark/style.json}
      # Styles on the upstream are handed out through the map cache (ADR-0029).
      LARES_MAP_PROXY: "true"
      LARES_MAP_UPSTREAM: ${LARES_MAP_UPSTREAM:-https://tiles.versatiles.org}
      LARES_MAP_LABEL_FONT: ${LARES_MAP_LABEL_FONT:-noto_sans_bold}
      # No colon: LARES_GEOCODER_URL set but empty stays empty and turns addresses off.
      LARES_GEOCODER_URL: ${LARES_GEOCODER_URL-https://nominatim.openstreetmap.org}
      LARES_GEOCODER_EMAIL: ${LARES_GEOCODER_EMAIL:-}
    mem_limit: 300m # measured max RSS 237 MiB + ~25 %, docs/architecture/perf/M0-baseline.md
    logging: *logging

  # Map cache (ADR-0029): style, tiles, glyphs and sprites fetched on demand, unused ones dropped after 7 days.
  mapcache:
    image: nginx:1.29.3-alpine
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: "^LARES_"
      LARES_MAP_UPSTREAM: ${LARES_MAP_UPSTREAM:-https://tiles.versatiles.org}
      LARES_MAP_UPSTREAM_HOST: ${LARES_MAP_UPSTREAM_HOST:-tiles.versatiles.org}
      LARES_MAP_CACHE_SIZE: ${LARES_MAP_CACHE_SIZE:-2g}
      LARES_PUBLIC_URL: ${LARES_PUBLIC_URL:-https://${LARES_DOMAIN:?set LARES_DOMAIN in .env}}
    volumes:
      - ./mapcache/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - map_cache:/var/cache/lares-map
    mem_limit: 32m
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - server
      - mapcache
    command: ["caddy", "run", "--config", "/etc/caddy/${LARES_CADDYFILE:-Caddyfile}", "--adapter", "caddyfile"]
    environment:
      LARES_DOMAIN: ${LARES_DOMAIN:?set LARES_DOMAIN in .env}
      LARES_NTFY_DOMAIN: ${LARES_NTFY_DOMAIN:-ntfy.${LARES_DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    logging: *logging

  ntfy:
    image: binwiederhier/ntfy:v2.32.0
    profiles: ["push"]
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://${LARES_NTFY_DOMAIN:-ntfy.${LARES_DOMAIN}}
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    mem_limit: 64m
    logging: *logging

volumes:
  pgdata:
  map_cache:
  caddy_data:
  caddy_config:
  ntfy_cache:
  ntfy_data:
